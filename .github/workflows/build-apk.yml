name: Build NIVIS Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets into www
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIVIS-v2.2-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: NIVIS v2.2.0 - Android APK & Field Console
          body: |
            ### ❄️ NIVIS - Polar Field Telemetry & Decision Console (Android APK)
            
            - **Native Android APK:** Doğrudan indirip kurabileceğiniz Android APK paketi.
            - **Endüstriyel Kutup Kokpiti:** Canlı Aurora Borealis, akıcı TDEE sayaç rulosu, 5 kademeli aktivite matrisi.
            - **Tamamen Çevrimdışı:** Kutup koşullarında internetsiz bağımsız biyometri, rasyon ve QR veri köprüsü.
            
            Bilimsel Model & Tasarım: **Serhat Tuna Atalay**
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
